name: Rustix checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-and-boot-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install image and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential just python-is-python3 qemu-system-x86 xorriso

      - name: Run Rust checks and boot smoke test
        run: just verify
