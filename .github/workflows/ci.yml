name: Rustix checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-and-boot-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install image and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential just ovmf python-is-python3 qemu-system-x86 xorriso

      - name: Run Rust checks and boot smoke test
        run: just verify
